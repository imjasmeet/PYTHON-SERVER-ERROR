version: '3.8'

services:
  python-server:
    build: .
    container_name: python-server-error
    ports:
      - "5000:5000"
    environment:
      - PORT=5000
      - FLASK_ENV=production
      - LOG_LEVEL=INFO
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:5000/health')"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    volumes:
      - ./logs:/app/logs
      - ./app.py:/app/app.py:ro
    networks:
      - app-network

networks:
  app-network:
    driver: bridge 